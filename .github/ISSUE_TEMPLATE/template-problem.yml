name: A template is wrong or broken
description: It does not work in a tool, or does something its page does not say
labels: [bug]
body:
  - type: input
    id: template
    attributes:
      label: Template
      placeholder: pull-request-reviewer
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [Claude Code, Codex, Cursor, Gemini CLI, GitHub Copilot]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
